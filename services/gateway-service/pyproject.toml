[project]
name = "gateway-service"
version = "0.1.0"
description = "CodeFlow 网关：统一入口/JWT 校验/限流/路由代理"
requires-python = ">=3.12"
dependencies = [
    "codeflow-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
]

[tool.uv.sources]
codeflow-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway_service"]
