[project]
name = "ai-service"
version = "0.1.0"
description = "CodeFlow AI 服务：LLM Chat / Code Review / Issue 分析 / RAG(pgvector)"
requires-python = ">=3.12"
dependencies = [
    "codeflow-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = ["aiosqlite>=0.20"]

[tool.uv.sources]
codeflow-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_service"]
