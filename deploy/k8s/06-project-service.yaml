apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-service
  namespace: codeflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project-service
  template:
    metadata:
      labels:
        app: project-service
    spec:
      containers:
        - name: project-service
          image: codeflow/project-service:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "project_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: codeflow-config
            - secretRef:
                name: codeflow-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://codeflow:codeflow@postgres:5432/codeflow_projects"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: project-service
  namespace: codeflow
spec:
  selector:
    app: project-service
  ports:
    - port: 8000
      targetPort: 8000
---
# HPA：CPU 超过 70% 自动扩容 2 -> 8（依赖 metrics-server）
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: project-service
  namespace: codeflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: project-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
