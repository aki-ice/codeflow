# 共享密钥（生产环境请用 sealed-secrets / external-secrets 管理）
apiVersion: v1
kind: Secret
metadata:
  name: codeflow-secrets
  namespace: codeflow
type: Opaque
stringData:
  SECRET_KEY: "change-me-to-a-random-secret-at-least-32-bytes-long"
  INTERNAL_TOKEN: "dev-internal-token"
  POSTGRES_USER: "codeflow"
  POSTGRES_PASSWORD: "codeflow"
---
# 各服务公共配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: codeflow-config
  namespace: codeflow
data:
  KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  REDIS_URL: "redis://redis:6379/0"
  USER_SERVICE_URL: "http://user-service:8000"
  PROJECT_SERVICE_URL: "http://project-service:8000"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8000"
  CI_SERVICE_URL: "http://ci-service:8000"
  GITHUB_WEBHOOK_SECRET: ""
  GITHUB_TOKEN: ""
---
# PostgreSQL 多库初始化脚本
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: codeflow
data:
  init.sql: |
    CREATE DATABASE codeflow_users;
    CREATE DATABASE codeflow_projects;
    CREATE DATABASE codeflow_notifications;
    CREATE DATABASE codeflow_ci;
