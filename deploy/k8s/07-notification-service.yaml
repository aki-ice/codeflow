apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: codeflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: codeflow/notification-service:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "notification_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: codeflow-config
            - secretRef:
                name: codeflow-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://codeflow:codeflow@postgres:5432/codeflow_notifications"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: codeflow
spec:
  selector:
    app: notification-service
  ports:
    - port: 8000
      targetPort: 8000
