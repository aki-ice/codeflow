apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: codeflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: codeflow/gateway-service:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "gateway_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: codeflow-config
            - secretRef:
                name: codeflow-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: codeflow
spec:
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
---
# Ingress：外部域名 -> gateway（需要集群已安装 ingress-nginx）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codeflow
  namespace: codeflow
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: codeflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
