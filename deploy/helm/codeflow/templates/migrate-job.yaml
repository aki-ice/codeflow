{{- if .Values.migrations.enabled }}
{{- range $item := .Values.migrations.items }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-{{ $item.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "codeflow.labels" $ | nindent 4 }}
  annotations:
    # helm upgrade 时重新运行迁移 Job
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "codeflow.image" (dict "image" $item.image "global" $.Values.global) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ include "codeflow.name" $ }}-config
            - secretRef:
                name: {{ include "codeflow.name" $ }}-secrets
          env:
            - name: DATABASE_URL
              value: {{ $item.databaseUrl | quote }}
{{- end }}
{{- end }}
