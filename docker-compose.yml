services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: codeflow
      POSTGRES_PASSWORD: codeflow
      POSTGRES_DB: codeflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: codeflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  # ===== 可观测性（Phase 12�?====
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger

  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP/HTTP

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-secret-at-least-32-bytes-long}
      DATABASE_URL: postgresql+asyncpg://codeflow:codeflow@postgres:5432/codeflow_users
      REDIS_URL: redis://redis:6379/0
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  project-service:
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    env_file: .env
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-secret-at-least-32-bytes-long}
      DATABASE_URL: postgresql+asyncpg://codeflow:codeflow@postgres:5432/codeflow_projects
      REDIS_URL: redis://redis:6379/0
      USER_SERVICE_URL: http://user-service:8000
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-secret-at-least-32-bytes-long}
      DATABASE_URL: postgresql+asyncpg://codeflow:codeflow@postgres:5432/codeflow_notifications
      REDIS_URL: redis://redis:6379/0
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ci-service:
    build:
      context: .
      dockerfile: services/ci-service/Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-secret-at-least-32-bytes-long}
      DATABASE_URL: postgresql+asyncpg://codeflow:codeflow@postgres:5432/codeflow_ci
      REDIS_URL: redis://redis:6379/0
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CI_SIMULATE: ${CI_SIMULATE:-true}
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-secret-at-least-32-bytes-long}
      DATABASE_URL: postgresql+asyncpg://codeflow:codeflow@postgres:5432/codeflow_ai
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8005:8000"
    depends_on:
      postgres:
        condition: service_healthy
  gateway:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-secret-at-least-32-bytes-long}
      REDIS_URL: redis://redis:6379/0
      USER_SERVICE_URL: http://user-service:8000
      PROJECT_SERVICE_URL: http://project-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      AI_SERVICE_URL: http://ai-service:8000
      CI_SERVICE_URL: http://ci-service:8000
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      project-service:
        condition: service_started
      notification-service:
        condition: service_started
      ci-service:
        condition: service_started

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
